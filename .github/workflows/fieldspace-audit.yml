name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source audit
        run: python scripts/audit_fieldspace.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce all 235 simulation/ablation runs
        run: |
          rm -rf /tmp/fieldspace-results
          python sim/fieldspace_sim.py --outdir /tmp/fieldspace-results
          test "$(($(wc -l < /tmp/fieldspace-results/ablation_results.csv)-1))" -eq 235

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Audit project axioms
        run: lake env lean -DwarningAsError=true Audit.lean
      - name: Test the axiom audit
        run: python3 scripts/test_axiom_audit.py
      - name: Record verification and unchanged dependency pins
        run: |
          git diff --exit-code -- lean-toolchain lakefile.toml lakefile.lean lake-manifest.json
          {
            echo '## Lean verification passed'
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Toolchain: $(cat lean-toolchain)"
            echo 'Passed: library build, project axiom audit, audit rejection controls.'
          } >> "$GITHUB_STEP_SUMMARY"
